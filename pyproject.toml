[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "any4d"
version = "1.0"
description = "Unified Feed-Forward Metric 4D Reconstruction"
readme = "readme.md"
authors = [{ name = "Jay Karhade", email = "jaykarhade3@gmail.com" }]
requires-python = ">=3.10.0"
dependencies = [
    "huggingface_hub",
    "hydra-core",
    "natsort",
    "opencv-python-headless==4.10.0.84",
    "orjson",
    "pillow-heif",
    "plyfile",
    "python-box",
    "safetensors",
    "tensorboard",
    "tqdm",
    "rerun-sdk>=0.23,<0.24",
    "torchaudio", ## Temp for AWS
    "torch>=2.7.0", ## fork: 2.6 cannot run sm_120 -- see [tool.uv.sources]
    "torchvision", ## Temp for AWS
    "trimesh",
    "matplotlib",
    "einops",
    "uniception @ git+https://github.com/JayKarhade/UniCeption.git@dev/any4d",
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@3913c65d81e05e47b9f367250cf8c0f7462a0900"
]

[project.optional-dependencies]
data = ["pandas"]
dev = ["pre-commit", "pytest", "pytest-cov", "ruff"]
gradio = [
    "gradio==5.45.0",
    "gradio_rerun",
    "spaces"
]

# Install all optional dependencies
all = [
    "any4d[data]",
    "any4d[dev]",
    "any4d[gradio]",
]

# Setuptools configuration
[tool.setuptools]
# Disable automatic package discovery to avoid conflicts
packages = ["any4d"]

# Include package data
[tool.setuptools.package-data]
"any4d" = ["**/*"]

# Ruff for linting
[tool.ruff]
# Enable the isort rules.
lint.extend-select = ["I"]

# Following https://www.internalfb.com/wiki/Python/code_formatting/pyfmt/
target-version = "py310"

# Following https://www.internalfb.com/wiki/Python/code_formatting/pyfmt/
[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
detect-same-package = false
order-by-type = false
known-first-party = ["any4d", "uniception"]

# ---------------------------------------------------------------- uv, not conda
# This fork's feature/uv branch replaces the README's conda flow with uv, which is the
# environment manager used across this lab. `main` is left byte-identical to upstream.
#
# TWO CHANGES FROM UPSTREAM, both forced by this machine:
#
# 1. torch 2.6 -> >=2.7. The GPU here is an RTX 5060 Ti, compute capability sm_120
#    (Blackwell). torch 2.6.0+cu124 supports sm_50 through sm_90 and refuses sm_120
#    outright: `CUDA capability sm_120 is not compatible with the current PyTorch
#    installation`. Blackwell kernels first ship in the cu128 wheels, which begin at
#    torch 2.7.0. Upstream's own comment on the pin is "## Temp for AWS", so it reads as
#    a deployment artefact rather than a real API constraint -- but it IS a change from
#    upstream, so if Any4D ever misbehaves here, suspect this first.
#
# 2. An explicit CUDA index. Upstream names no index, so a plain resolve takes whatever
#    default wheel PyPI serves -- which can be a CPU build that makes the model appear to
#    work while running orders of magnitude slow, with no error anywhere.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
